<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arite的思考</title>
    <style>
        body {
            font-family: "Microsoft YaHei", system-ui, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            margin: 0;
            padding: 20px;
            color: #333;
            line-height: 1.8;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        header {
            background: linear-gradient(135deg, #2c3e50, #3498db);
            color: white;
            text-align: center;
            padding: 80px 20px 50px;
        }
        h1 { margin: 0; font-size: 2.8em; }
        .subtitle { font-size: 1.3em; margin-top: 10px; opacity: 0.95; }
        
        .quotes {
            padding: 50px 40px;
        }
        .quote-card {
            background: #f8f9fa;
            border-left: 8px solid #3498db;
            margin-bottom: 35px;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.06);
        }
        .quote-text {
            font-size: 1.35em;
            font-style: italic;
            margin-bottom: 18px;
            color: #222;
        }
        .author {
            text-align: right;
            color: #555;
            font-weight: 500;
        }
        
        footer {
            text-align: center;
            padding: 40px 20px;
            color: #777;
            background: #f8f9fa;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>山川的人生格言</h1>
            <p class="subtitle">喜欢的话，记下来，与有缘人分享</p>
        </header>
        
        <div class="quotes">
            <!-- 把你的格言复制到这里，每一条用下面这个格式 -->
            
            <div class="quote-card">
                <div class="quote-text">“这里放你第一条格言”</div>
                <div class="author">—— 出处或你自己</div>
            </div>
            
            <div class="quote-card">
                <div class="quote-text">“这里放你第二条格言”</div>
                <div class="author">—— 出处或你自己</div>
            </div>
            
        </div>
        
        <footer>
            <p>© 2026 山川 · 人生值得慢慢品味</p>
            <p>欢迎分享这个网站</p>
        </footer>
    </div>
</body>
</html>
